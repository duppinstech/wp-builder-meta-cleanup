name: Feature request
description: Suggest a stack target, CLI flag, or other change
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. New cleanup targets need an inactive-stack rule. Please leave out secrets and database dumps.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, and when should a delete be allowed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Plugin, theme, or option names if this is a new target.
    validations:
      required: false
