name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Lint
        run: php tests/lint.php

      - name: Test
        run: php tests/smoke.php

      - name: Release notes for the current version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' builder-meta-cleanup.php | tr -d '\r')
          bash bin/release-notes.sh "$version" builder-meta-cleanup.php "$RUNNER_TEMP/release-notes.md"
