name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' builder-meta-cleanup.php | tr -d '\r')
          constant=$(sed -n "s/^define( 'BUILDER_META_CLEANUP_VERSION', '\(.*\)' );/\1/p" builder-meta-cleanup.php | tr -d '\r')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag does not match plugin header, BUILDER_META_CLEANUP_VERSION, or readme Stable tag."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Lint
        run: php tests/lint.php

      - name: Test
        run: php tests/smoke.php

      - name: Package
        run: bash bin/build-zip.sh "$GITHUB_WORKSPACE/wp-builder-meta-cleanup.zip"

      - name: Write release notes
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" builder-meta-cleanup.php release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-builder-meta-cleanup.zip
          body_path: release-notes.md
